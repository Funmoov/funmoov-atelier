        letter-spacing="0">f</text>

  <!-- Texte funmoov -->
  <text x="256" y="438"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="58"
        font-weight="500"
        fill="#1d3a4a"
        text-anchor="middle"
        letter-spacing="-1">funmoov</text>

  <!-- Texte ATELIER -->
  <text x="256" y="482"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
