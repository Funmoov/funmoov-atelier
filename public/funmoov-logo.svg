<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo funmoov atelier -->
  <!-- Cercle extérieur -->
  <circle cx="256" cy="256" r="246" fill="#ffffff" stroke="#1d3a4a" stroke-width="6"/>

  <!-- Lettre "f" en typographie (utilisation de la police système sans-serif) -->
  <text x="256" y="340"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="340"
        font-weight="500"
        fill="#1d3a4a"
