<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Version maskable pour Android adaptive icons (safe zone ~40% du centre) -->
  <rect width="512" height="512" fill="#1d3a4a"/>
  <circle cx="256" cy="256" r="170" fill="#ffffff"/>

  <!-- Lettre "f" centrée dans la safe zone -->
  <text x="256" y="335"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="240"
        font-weight="500"
        fill="#1d3a4a"
        text-anchor="middle">f</text>
</svg>
